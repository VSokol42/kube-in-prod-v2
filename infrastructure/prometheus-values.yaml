grafana:
  service:
    type: NodePort
    nodePort: 30000

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false

prometheus-node-exporter:
  hostRootFsMount:
    enabled: false

admissionWebhooks:
  enabled: false

prometheusOperator:
  admissionWebhooks:
    enabled: false