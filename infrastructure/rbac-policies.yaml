# --- MENTOR: RW Access to Student Namespaces ---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: student01
  name: mentor-rw
rules:
- apiGroups: ["", "apps", "batch", "networking.k8s.io"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: student01
  name: mentor-rw-student01
subjects:
- kind: ServiceAccount
  name: mentor
  namespace: mentor-system
roleRef:
  kind: Role
  name: mentor-rw
  apiGroup: rbac.authorization.k8s.io
---
